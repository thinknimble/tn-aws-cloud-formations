AWSTemplateFormatVersion: '2010-09-09'
Description: Spekk sandbox — launches an Ubuntu 24.04 instance in an isolated VPC with SSH access.

Parameters:
  InstanceType:
    Type: String
    Default: t3.medium
    Description: EC2 instance type

  KeyPairName:
    Type: String
    Default: ''
    Description: Name of an existing EC2 key pair for SSH access. Leave empty to auto-create one (private key stored in SSM Parameter Store).

  SSHSourceCIDR:
    Type: String
    Default: '0.0.0.0/0'
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/\d{1,2}'
    ConstraintDescription: Must be a valid CIDR (e.g. 203.0.113.0/32)
    Description: CIDR block allowed to SSH into the instance. Defaults to 0.0.0.0/0 (anywhere).

  UbuntuAMI:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
    Description: Ubuntu 24.04 LTS AMI (resolved via Canonical SSM public parameter)

  ExistingVpcId:
    Type: String
    Default: ''
    Description: ID of an existing VPC to use. Leave empty to create a new VPC.

  ExistingSubnetId:
    Type: String
    Default: ''
    Description: ID of an existing subnet to use. Leave empty to create a new subnet. The subnet must have a route to an Internet Gateway and MapPublicIpOnLaunch enabled.

Rules:
  BothOrNeitherVpcSubnet:
    Assertions:
      - Assert:
          Fn::Or:
            - Fn::And:
                - !Not [!Equals [!Ref ExistingVpcId, '']]
                - !Not [!Equals [!Ref ExistingSubnetId, '']]
            - Fn::And:
                - !Equals [!Ref ExistingVpcId, '']
                - !Equals [!Ref ExistingSubnetId, '']
        AssertDescription: You must provide both ExistingVpcId and ExistingSubnetId, or leave both empty. Providing only one is not allowed.

Conditions:
  CreateKeyPair: !Equals [!Ref KeyPairName, '']
  CreateNetworkResources: !Equals [!Ref ExistingVpcId, '']

Resources:
  # --- Networking (created only when no existing VPC is provided) ---
  VPC:
    Type: AWS::EC2::VPC
    Condition: CreateNetworkResources
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub spekk-sandbox-${AWS::StackName}

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: CreateNetworkResources
    Properties:
      Tags:
        - Key: Name
          Value: !Sub spekk-sandbox-${AWS::StackName}

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: CreateNetworkResources
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Condition: CreateNetworkResources
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub spekk-sandbox-${AWS::StackName}

  RouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateNetworkResources
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub spekk-sandbox-${AWS::StackName}

  PublicRoute:
    Type: AWS::EC2::Route
    Condition: CreateNetworkResources
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateNetworkResources
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref RouteTable

  # --- Key Pair (created only when KeyPairName is not provided) ---
  GeneratedKeyPair:
    Type: AWS::EC2::KeyPair
    Condition: CreateKeyPair
    Properties:
      KeyName: !Sub ${AWS::StackName}-key
      Tags:
        - Key: Name
          Value: !Sub spekk-sandbox-${AWS::StackName}

  # --- Security ---
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSH access for spekk sandbox
      VpcId: !If [CreateNetworkResources, !Ref VPC, !Ref ExistingVpcId]
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHSourceCIDR
      Tags:
        - Key: Name
          Value: !Sub spekk-sandbox-${AWS::StackName}

  # --- Instance ---
  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref UbuntuAMI
      InstanceType: !Ref InstanceType
      KeyName: !If [CreateKeyPair, !Ref GeneratedKeyPair, !Ref KeyPairName]
      SubnetId: !If [CreateNetworkResources, !Ref PublicSubnet, !Ref ExistingSubnetId]
      SecurityGroupIds:
        - !Ref SecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 50
            VolumeType: gp3
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub spekk-sandbox-${AWS::StackName}

Outputs:
  PublicIP:
    Description: Public IP address of the sandbox instance
    Value: !GetAtt Instance.PublicIp

  InstanceId:
    Description: EC2 instance ID
    Value: !Ref Instance

  KeyPairSSMParameter:
    Condition: CreateKeyPair
    Description: Retrieve the private key with — aws ssm get-parameter --name <this-value> --with-decryption --query Parameter.Value --output text
    Value: !Sub /ec2/keypair/${GeneratedKeyPair.KeyPairId}

  SpekkCommand:
    Description: Paste this command to register the sandbox with spekk
    Value: !Sub
      - spekk sandbox create --provider manual --name ${AWS::StackName} --ip ${Instance.PublicIp} --ssh-key ${KeyName}
      - KeyName: !If [CreateKeyPair, !Sub '${AWS::StackName}-key', !Ref KeyPairName]
